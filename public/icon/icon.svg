<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071C5"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Layer 1: Rounded Rectangle Badge -->
  <rect x="22" y="22" width="84" height="84" rx="10" ry="10"
        fill="url(#bg)" stroke="#00C7FD" stroke-width="2" stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Layer 2: Two Fast-Forward Triangles (blue accent) -->
  <!-- Left triangle -->
  <polygon points="48,38 48,86 68,62"
           fill="#00C7FD" stroke="#00C7FD" stroke-width="2"
           stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right triangle -->
  <polygon points="68,38 68,86 88,62"
           fill="#00C7FD" stroke="#00C7FD" stroke-width="2"
           stroke-linejoin="round" stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071C5"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Layer 1: Rounded Rectangle Badge (6px safety margin, 116×116) -->
  <rect x="6" y="6" width="116" height="116" rx="14" ry="14"
        fill="url(#bg)" stroke="#00C7FD" stroke-width="2" stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Layer 2: Two Fast-Forward Triangles (blue accent, centered at 64,64) -->
  <!-- Left triangle -->
  <polygon points="37,32 37,96 64,64"
           fill="#00C7FD" stroke="#00C7FD" stroke-width="2"
           stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right triangle -->
  <polygon points="64,32 64,96 91,64"
           fill="#00C7FD" stroke="#00C7FD" stroke-width="2"
           stroke-linejoin="round" stroke-linecap="round"/>
</svg>

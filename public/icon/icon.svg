<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071C5"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Layer 1: Background Badge -->
  <rect x="24" y="24" width="80" height="80" rx="9" ry="9"
        fill="url(#bgGrad)"
        stroke="#00C7FD" stroke-width="2"
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Layer 2: Three right-pointing triangles (>>>) -->
  <g fill="#FFFFFF">
    <path d="M43,53 L55,64 L43,75 Z"/>
    <path d="M58,53 L70,64 L58,75 Z"/>
    <path d="M73,53 L85,64 L73,75 Z"/>
  </g>
</svg>
